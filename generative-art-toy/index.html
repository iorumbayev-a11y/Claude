<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Kaleidoscope</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05060a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    cursor: crosshair;
  }
  #panel {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 240px;
    background: rgba(15, 17, 26, 0.72);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px 16px 16px;
    color: #e8e8f0;
    font-size: 12px;
    z-index: 10;
    transition: opacity 0.25s ease, transform 0.25s ease;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  #panel.hidden {
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
  }
  #panel h1 {
    font-size: 13px;
    margin: 0 0 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #9fb4ff;
    font-weight: 600;
  }
  .row {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 10px;
  }
  .row label {
    display: flex;
    justify-content: space-between;
    color: #b7bcd0;
  }
  .row label span.val {
    color: #7ee2c8;
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    width: 100%;
    accent-color: #7ee2c8;
  }
  .buttons {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  button {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8e8f0;
    padding: 7px 8px;
    border-radius: 8px;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.15s ease;
    min-width: 60px;
  }
  button:hover {
    background: rgba(255,255,255,0.18);
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #btn-gif.recording {
    background: rgba(255, 90, 90, 0.25);
    border-color: rgba(255, 90, 90, 0.4);
  }
  #gif-status {
    margin-top: 6px;
    min-height: 14px;
    color: #9fb4ff;
    font-size: 11px;
    letter-spacing: 0.02em;
  }
  #hint {
    position: fixed;
    bottom: 14px;
    left: 16px;
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    z-index: 10;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <h1>Flow Kaleidoscope</h1>

  <div class="row">
    <label>Symmetry <span class="val" id="v-sym">8</span></label>
    <input type="range" id="sym" min="1" max="16" step="1" value="8">
  </div>
  <div class="row">
    <label>Particles <span class="val" id="v-count">900</span></label>
    <input type="range" id="count" min="100" max="2500" step="50" value="900">
  </div>
  <div class="row">
    <label>Speed <span class="val" id="v-speed">1.4</span></label>
    <input type="range" id="speed" min="0.2" max="4" step="0.1" value="1.4">
  </div>
  <div class="row">
    <label>Trail length <span class="val" id="v-trail">85</span></label>
    <input type="range" id="trail" min="60" max="99" step="1" value="85">
  </div>
  <div class="row">
    <label>Field scale <span class="val" id="v-scale">1.6</span></label>
    <input type="range" id="scale" min="0.3" max="4" step="0.1" value="1.6">
  </div>
  <div class="row">
    <label>Mouse pull <span class="val" id="v-mouse">0.6</span></label>
    <input type="range" id="mouse" min="0" max="2" step="0.05" value="0.6">
  </div>
  <div class="row">
    <label>Hue drift <span class="val" id="v-hue">0.15</span></label>
    <input type="range" id="hue" min="0" max="1" step="0.01" value="0.15">
  </div>

  <div class="buttons">
    <button id="btn-palette">New palette</button>
    <button id="btn-clear">Clear</button>
    <button id="btn-save">Save PNG</button>
    <button id="btn-pause">Pause</button>
    <button id="btn-gif">Record GIF</button>
  </div>
  <div id="gif-status"></div>
</div>

<div id="hint">drag mouse to steer · click to repel · H to hide panel</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const panel = document.getElementById('panel');
  const hint = document.getElementById('hint');

  let W, H, CX, CY;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    CX = W / 2; CY = H / 2;
    ctx.fillStyle = '#05060a';
    ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', resize);

  // --- controls ---
  const controls = {
    sym: document.getElementById('sym'),
    count: document.getElementById('count'),
    speed: document.getElementById('speed'),
    trail: document.getElementById('trail'),
    scale: document.getElementById('scale'),
    mouse: document.getElementById('mouse'),
    hue: document.getElementById('hue'),
  };
  const vals = {
    sym: document.getElementById('v-sym'),
    count: document.getElementById('v-count'),
    speed: document.getElementById('v-speed'),
    trail: document.getElementById('v-trail'),
    scale: document.getElementById('v-scale'),
    mouse: document.getElementById('v-mouse'),
    hue: document.getElementById('v-hue'),
  };
  const state = {};
  function readControls() {
    for (const k in controls) {
      state[k] = parseFloat(controls[k].value);
      vals[k].textContent = controls[k].value;
    }
  }
  for (const k in controls) {
    controls[k].addEventListener('input', () => {
      readControls();
      if (k === 'count') spawnParticles();
    });
  }
  readControls();

  // --- lightweight 2D value noise (no deps) ---
  const NOISE_SIZE = 256;
  const perm = new Uint8Array(NOISE_SIZE * 2);
  (function seedNoise() {
    const p = new Uint8Array(NOISE_SIZE);
    for (let i = 0; i < NOISE_SIZE; i++) p[i] = i;
    for (let i = NOISE_SIZE - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [p[i], p[j]] = [p[j], p[i]];
    }
    for (let i = 0; i < NOISE_SIZE * 2; i++) perm[i] = p[i & 255];
  })();
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(a, b, t) { return a + t * (b - a); }
  function grad(hash, x, y) {
    const h = hash & 7;
    const u = h < 4 ? x : y;
    const v = h < 4 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -2 * v : 2 * v);
  }
  function noise2D(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = fade(x), v = fade(y);
    const aa = perm[perm[X] + Y], ab = perm[perm[X] + Y + 1];
    const ba = perm[perm[X + 1] + Y], bb = perm[perm[X + 1] + Y + 1];
    const res = lerp(
      lerp(grad(aa, x, y), grad(ba, x - 1, y), u),
      lerp(grad(ab, x, y - 1), grad(bb, x - 1, y - 1), u),
      v
    );
    return res; // roughly -1..1
  }

  // --- palette ---
  let baseHue = Math.random() * 360;
  let hueSpread = 60 + Math.random() * 120;
  function newPalette() {
    baseHue = Math.random() * 360;
    hueSpread = 60 + Math.random() * 120;
  }

  // --- particles ---
  let particles = [];
  function spawnParticles() {
    const n = Math.round(state.count);
    particles = new Array(n);
    for (let i = 0; i < n; i++) {
      particles[i] = makeParticle();
    }
  }
  function makeParticle() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      hueOffset: Math.random(),
      life: 60 + Math.random() * 200,
      age: Math.random() * 200,
    };
  }

  // --- mouse ---
  const mouseState = { x: -9999, y: -9999, active: false, repel: false };
  canvas.addEventListener('pointermove', (e) => {
    mouseState.x = e.clientX;
    mouseState.y = e.clientY;
    mouseState.active = true;
  });
  canvas.addEventListener('pointerdown', (e) => {
    mouseState.repel = true;
  });
  canvas.addEventListener('pointerup', () => { mouseState.repel = false; });
  canvas.addEventListener('pointerleave', () => { mouseState.active = false; });

  // --- kaleidoscope draw helper ---
  function drawSegment(x0, y0, x1, y1, hue, alpha) {
    const sym = Math.round(state.sym);
    ctx.strokeStyle = `hsla(${hue}, 85%, 62%, ${alpha})`;
    for (let i = 0; i < sym; i++) {
      const ang = (Math.PI * 2 * i) / sym;
      const cosA = Math.cos(ang), sinA = Math.sin(ang);
      // rotate around center
      const rx0 = CX + (x0 - CX) * cosA - (y0 - CY) * sinA;
      const ry0 = CY + (x0 - CX) * sinA + (y0 - CY) * cosA;
      const rx1 = CX + (x1 - CX) * cosA - (y1 - CY) * sinA;
      const ry1 = CY + (x1 - CX) * sinA + (y1 - CY) * cosA;
      ctx.beginPath();
      ctx.moveTo(rx0, ry0);
      ctx.lineTo(rx1, ry1);
      ctx.stroke();

      // mirrored copy for extra symmetry richness
      const mx0 = CX - (x0 - CX) * cosA - (y0 - CY) * sinA;
      const my0 = CY + (x0 - CX) * sinA - (y0 - CY) * cosA;
      const mx1 = CX - (x1 - CX) * cosA - (y1 - CY) * sinA;
      const my1 = CY + (x1 - CX) * sinA - (y1 - CY) * cosA;
      ctx.beginPath();
      ctx.moveTo(mx0, my0);
      ctx.lineTo(mx1, my1);
      ctx.stroke();
    }
  }

  let paused = false;
  let t = 0;

  function step() {
    if (!paused) {
      t += 0.0025;

      // fade trails
      const fadeAmount = (100 - state.trail) / 400;
      ctx.fillStyle = `rgba(5, 6, 10, ${fadeAmount})`;
      ctx.fillRect(0, 0, W, H);

      ctx.lineWidth = 1.1;
      ctx.globalCompositeOperation = 'screen';

      const scale = state.scale * 0.003;
      const speed = state.speed * 2.2;
      const mousePull = state.mouse;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const x0 = p.x, y0 = p.y;

        let angle = noise2D(p.x * scale, p.y * scale + t * 40) * Math.PI * 2.2
                  + noise2D(p.x * scale * 0.5 + 50, p.y * scale * 0.5 + t * 20) * Math.PI;

        if (mouseState.active && mousePull > 0) {
          const dx = mouseState.x - p.x, dy = mouseState.y - p.y;
          const d2 = dx * dx + dy * dy + 1;
          const pull = Math.min(mousePull * 6000 / d2, 1.2) * (mouseState.repel ? -1 : 1);
          const mAngle = Math.atan2(dy, dx);
          angle = angle * (1 - Math.abs(pull) * 0.5) + mAngle * pull * 0.5;
        }

        p.x += Math.cos(angle) * speed;
        p.y += Math.sin(angle) * speed;
        p.age++;

        if (p.age > p.life || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
          Object.assign(p, makeParticle());
          continue;
        }

        const hue = (baseHue + p.hueOffset * hueSpread + t * state.hue * 400) % 360;
        const alpha = 0.35 * (1 - p.age / p.life) + 0.1;
        drawSegment(x0, y0, p.x, p.y, hue, alpha);
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    requestAnimationFrame(step);
  }

  // --- minimal self-contained GIF89a encoder (median-cut quantizer + LZW) ---
  function medianCutPalette(pixels, maxColors) {
    if (pixels.length === 0) return [[0, 0, 0]];
    let boxes = [pixels];
    while (boxes.length < maxColors) {
      let boxIndex = -1, maxRange = -1, splitChannel = 0;
      for (let b = 0; b < boxes.length; b++) {
        const box = boxes[b];
        if (box.length < 2) continue;
        for (let c = 0; c < 3; c++) {
          let mn = 255, mx = 0;
          for (const p of box) { if (p[c] < mn) mn = p[c]; if (p[c] > mx) mx = p[c]; }
          const range = mx - mn;
          if (range > maxRange) { maxRange = range; boxIndex = b; splitChannel = c; }
        }
      }
      if (boxIndex === -1) break;
      const box = boxes[boxIndex];
      box.sort((a, b) => a[splitChannel] - b[splitChannel]);
      const mid = box.length >> 1;
      boxes.splice(boxIndex, 1, box.slice(0, mid), box.slice(mid));
    }
    return boxes.map((box) => {
      let r = 0, g = 0, b = 0;
      for (const p of box) { r += p[0]; g += p[1]; b += p[2]; }
      const n = box.length || 1;
      return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
    });
  }

  function buildNearestColorLUT(palette, levels) {
    const lut = new Uint8Array(levels * levels * levels);
    const step = 256 / levels;
    let idx = 0;
    for (let r = 0; r < levels; r++) {
      for (let g = 0; g < levels; g++) {
        for (let b = 0; b < levels; b++) {
          const rr = r * step + step / 2, gg = g * step + step / 2, bb = b * step + step / 2;
          let best = 0, bestDist = Infinity;
          for (let i = 0; i < palette.length; i++) {
            const pc = palette[i];
            const dr = rr - pc[0], dg = gg - pc[1], db = bb - pc[2];
            const dist = dr * dr + dg * dg + db * db;
            if (dist < bestDist) { bestDist = dist; best = i; }
          }
          lut[idx++] = best;
        }
      }
    }
    return lut;
  }

  function lzwEncode(indices, minCodeSize) {
    const clearCode = 1 << minCodeSize;
    const eoiCode = clearCode + 1;
    let codeSize, nextCode, dict;
    function resetDict() {
      dict = new Map();
      for (let i = 0; i < clearCode; i++) dict.set(String.fromCharCode(i), i);
      nextCode = eoiCode + 1;
      codeSize = minCodeSize + 1;
    }
    resetDict();
    const output = [];
    let bitBuffer = 0, bitCount = 0;
    function emit(code) {
      bitBuffer |= (code << bitCount);
      bitCount += codeSize;
      while (bitCount >= 8) {
        output.push(bitBuffer & 0xFF);
        bitBuffer >>= 8;
        bitCount -= 8;
      }
    }
    emit(clearCode);
    let w = String.fromCharCode(indices[0]);
    for (let i = 1; i < indices.length; i++) {
      const k = String.fromCharCode(indices[i]);
      const wk = w + k;
      if (dict.has(wk)) {
        w = wk;
      } else {
        emit(dict.get(w));
        if (nextCode < 4096) {
          dict.set(wk, nextCode);
          nextCode++;
          if (nextCode >= (1 << codeSize) && codeSize < 12) codeSize++;
        } else {
          emit(clearCode);
          resetDict();
        }
        w = k;
      }
    }
    emit(dict.get(w));
    emit(eoiCode);
    if (bitCount > 0) output.push(bitBuffer & 0xFF);
    return output;
  }

  function GIFWriter(width, height, palette) {
    this.bytes = [];
    this.width = width;
    this.height = height;
    const colorTableSize = palette.length;
    const bitsPerPixel = Math.max(2, Math.ceil(Math.log2(colorTableSize)));
    this.minCodeSize = bitsPerPixel;
    const writeStr = (s) => { for (let i = 0; i < s.length; i++) this.bytes.push(s.charCodeAt(i)); };
    const writeShort = (v) => { this.bytes.push(v & 0xFF, (v >> 8) & 0xFF); };
    writeStr('GIF89a');
    writeShort(width);
    writeShort(height);
    const gctFlag = 1, colorRes = bitsPerPixel - 1, sortFlag = 0, gctSize = bitsPerPixel - 1;
    this.bytes.push((gctFlag << 7) | (colorRes << 4) | (sortFlag << 3) | gctSize);
    this.bytes.push(0, 0);
    const fullSize = 1 << bitsPerPixel;
    for (let i = 0; i < fullSize; i++) {
      const c = palette[i] || [0, 0, 0];
      this.bytes.push(c[0], c[1], c[2]);
    }
    // NETSCAPE2.0 application extension: loop forever
    this.bytes.push(0x21, 0xFF, 0x0B);
    writeStr('NETSCAPE2.0');
    this.bytes.push(3, 1, 0, 0, 0);
    this._writeShort = writeShort;
  }
  GIFWriter.prototype.addFrame = function (indices, delayCs) {
    this.bytes.push(0x21, 0xF9, 4, 0);
    this._writeShort(delayCs);
    this.bytes.push(0, 0);
    this.bytes.push(0x2C);
    this._writeShort(0); this._writeShort(0);
    this._writeShort(this.width); this._writeShort(this.height);
    this.bytes.push(0);
    this.bytes.push(this.minCodeSize);
    const data = lzwEncode(indices, this.minCodeSize);
    let i = 0;
    while (i < data.length) {
      const end = Math.min(i + 255, data.length);
      this.bytes.push(end - i);
      for (let j = i; j < end; j++) this.bytes.push(data[j]);
      i = end;
    }
    this.bytes.push(0);
  };
  GIFWriter.prototype.finish = function () { this.bytes.push(0x3B); };
  GIFWriter.prototype.toBlob = function () { return new Blob([new Uint8Array(this.bytes)], { type: 'image/gif' }); };

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // --- GIF recording ---
  const gifBtn = document.getElementById('btn-gif');
  const gifStatus = document.getElementById('gif-status');
  let isRecording = false;

  async function recordGif() {
    if (isRecording) return;
    isRecording = true;
    gifBtn.disabled = true;
    gifBtn.classList.add('recording');

    const wasPaused = paused;
    paused = false;

    const FPS = 8;
    const DURATION_S = 2.5;
    const TOTAL_FRAMES = Math.round(FPS * DURATION_S);
    const RECORD_W = Math.min(320, W);
    const RECORD_H = Math.round(H * (RECORD_W / W));

    const offscreen = document.createElement('canvas');
    offscreen.width = RECORD_W;
    offscreen.height = RECORD_H;
    const octx = offscreen.getContext('2d', { willReadFrequently: true });

    const rawFrames = [];
    for (let f = 0; f < TOTAL_FRAMES; f++) {
      gifStatus.textContent = `Recording ${f + 1}/${TOTAL_FRAMES}...`;
      octx.drawImage(canvas, 0, 0, W, H, 0, 0, RECORD_W, RECORD_H);
      rawFrames.push(octx.getImageData(0, 0, RECORD_W, RECORD_H).data);
      await wait(1000 / FPS);
    }

    paused = wasPaused;

    gifStatus.textContent = 'Building palette...';
    await wait(0);
    const samples = [];
    const frameStride = Math.max(1, Math.floor(rawFrames.length / 6));
    for (let f = 0; f < rawFrames.length; f += frameStride) {
      const data = rawFrames[f];
      for (let i = 0; i < data.length; i += 4 * 5) {
        samples.push([data[i], data[i + 1], data[i + 2]]);
      }
    }
    const palette = medianCutPalette(samples, 80);
    const lutLevels = 24;
    const lut = buildNearestColorLUT(palette, lutLevels);

    const writer = new GIFWriter(RECORD_W, RECORD_H, palette);
    const delayCs = Math.round(100 / FPS);

    for (let f = 0; f < rawFrames.length; f++) {
      gifStatus.textContent = `Encoding ${f + 1}/${rawFrames.length}...`;
      const data = rawFrames[f];
      const pixelCount = RECORD_W * RECORD_H;
      const indices = new Uint8Array(pixelCount);
      for (let p = 0; p < pixelCount; p++) {
        const o = p * 4;
        const ri = (data[o] * lutLevels) >> 8;
        const gi = (data[o + 1] * lutLevels) >> 8;
        const bi = (data[o + 2] * lutLevels) >> 8;
        indices[p] = lut[ri * lutLevels * lutLevels + gi * lutLevels + bi];
      }
      writer.addFrame(indices, delayCs);
      if (f % 4 === 3) await wait(0);
    }
    writer.finish();

    gifStatus.textContent = 'Saving...';
    await wait(0);
    const blob = writer.toBlob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = `flow-kaleidoscope-${Date.now()}.gif`;
    link.href = url;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);

    gifStatus.textContent = 'Saved!';
    setTimeout(() => { gifStatus.textContent = ''; }, 2500);

    gifBtn.disabled = false;
    gifBtn.classList.remove('recording');
    isRecording = false;
  }

  // --- buttons ---
  gifBtn.addEventListener('click', recordGif);
  document.getElementById('btn-palette').addEventListener('click', newPalette);
  document.getElementById('btn-clear').addEventListener('click', () => {
    ctx.fillStyle = '#05060a';
    ctx.fillRect(0, 0, W, H);
  });
  document.getElementById('btn-save').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `flow-kaleidoscope-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
  const pauseBtn = document.getElementById('btn-pause');
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  });

  window.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'h') {
      panel.classList.toggle('hidden');
      hint.style.opacity = hint.style.opacity === '0' ? '1' : '0';
    }
  });

  resize();
  spawnParticles();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
